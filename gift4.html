<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Album</title>
<link rel="stylesheet" href="gift4.css">
</head>
<body>

<div id="tapScreen">
  <p>Tap to enter ❤️</p>
</div>

<div id="main" style="display:none;">
  <div class="player">
    <img src="images.jfif" class="cover">
    <div class="song-info">
      <small>a thousand years</small>
      <p>Christina Perri</p>
      <span>♡ Save on Spotify</span>
    </div>
    <button id="play">❚❚</button>
  </div>

  <div class="cd-box">
    <div class="cd" id="cd">
      <img src="photo1.jpg" class="p1">
      <img src="photo2.jpg" class="p2">
      <img src="photo3.jpg" class="p3">
      <p class="quote">Love of my dreams,<br>but better. You're real.</p>
    </div>
  </div>
</div>

<audio id="audio" src="a_thousand_years.mp3" loop></audio>

<script src="gift4.js"></script>
</body>
</html>
