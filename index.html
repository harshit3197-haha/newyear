<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Year Countdown</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="timer">

  <div class="time-box">
    <span id="days">00</span>
    <p>Days</p>
  </div>

  <div class="colon">:</div>

  <div class="time-box">
    <span id="hours">00</span>
    <p>Hours</p>
  </div>

  <div class="colon">:</div>

  <div class="time-box">
    <span id="minutes">00</span>
    <p>Minutes</p>
  </div>

  <div class="colon">:</div>

  <div class="time-box">
    <span id="seconds">00</span>
    <p>Seconds</p>
  </div>

</div>

  <h1>🎉 Happy New Year 🎉</h1>

  <button class="next-btn"
  onclick="location.href='page2.html'">Go to Next Page →</button>

</div>

<video src="gif1.gif" class="gif"  autoplay loop muted playsinline></video>>

<script src="script.js"></script>
</body>
</html>
